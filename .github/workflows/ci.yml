name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests, then integration tests against PostgreSQL in a container, then the coverage gate.
      - name: Build
        run: ./mvnw -B -ntp verify

      - name: Keep the proof run's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-report
          path: mizan-app/target/proof/report.md
          if-no-files-found: ignore

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/*-reports/"
          retention-days: 7

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Links and diagrams
        run: python3 scripts/check-docs.py
